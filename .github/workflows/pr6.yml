name: ПР6

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pr6/requirements-test.txt
      - name: Встановити залежності перевірок
        run: python -m pip install -r pr6/requirements-test.txt
      - name: Перевірити код
        working-directory: pr6
        run: ruff check app tests eval build_index.py check_env.py
      - name: Запустити тести
        working-directory: pr6
        run: pytest -q
