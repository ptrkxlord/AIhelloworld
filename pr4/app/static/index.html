<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>PR4 Support Assistant</title>
<style>
body { font-family: sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; }
h1 { font-size: 20px; }
.layout { display: flex; gap: 24px; }
.chat { flex: 2; display: flex; flex-direction: column; }
.side { flex: 1; }
#messages { border: 1px solid #ccc; border-radius: 6px; height: 420px; overflow-y: auto; padding: 12px; background: #fafafa; }
.msg { margin-bottom: 10px; padding: 8px 10px; border-radius: 6px; max-width: 85%; white-space: pre-wrap; }
.msg.user { background: #d6e8ff; margin-left: auto; }
.msg.assistant { background: #e6f4e6; }
.row { display: flex; gap: 8px; margin-top: 12px; }
#input { flex: 1; padding: 8px; font-size: 15px; }
button { padding: 8px 16px; font-size: 15px; cursor: pointer; }
.card { border: 1px solid #ccc; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
.card h2 { font-size: 15px; margin: 0 0 8px; }
.card dl { margin: 0; }
.card dt { font-weight: bold; font-size: 12px; color: #555; }
.card dd { margin: 0 0 8px; }
.flag-true { color: #a15c00; }
.flag-escalate { color: #b00020; font-weight: bold; }
#error { color: #b00020; margin-top: 10px; }
</style>
</head>
<body>
<h1>Помічник служби підтримки — "Атлас"</h1>

<div class="layout">
  <div class="chat">
    <div id="messages"></div>
    <div class="row">
      <input type="text" id="input" placeholder="Опишіть звернення...">
      <button id="send">Надіслати</button>
      <button id="reset">Нова розмова</button>
    </div>
    <div id="error"></div>
  </div>

  <div class="side">
    <div class="card">
      <h2>Картка звернення</h2>
      <dl id="ticket">
        <dt>Тема</dt><dd data-field="topic">—</dd>
        <dt>Номер замовлення</dt><dd data-field="order_number">—</dd>
        <dt>На підставі правил</dt><dd data-field="grounded_in_rules">—</dd>
        <dt>Потрібне уточнення</dt><dd data-field="needs_clarification">—</dd>
        <dt>Передано оператору</dt><dd data-field="escalate_to_human">—</dd>
      </dl>
    </div>
    <div class="card">
      <h2>Службові дані</h2>
      <dl id="service">
        <dt>Модель</dt><dd data-field="model">—</dd>
        <dt>Час відповіді</dt><dd data-field="latency_ms">—</dd>
        <dt>Токени (prompt / completion / total)</dt><dd data-field="usage">—</dd>
        <dt>Власна оцінка токенів запиту</dt><dd data-field="estimated_tokens">—</dd>
        <dt>Повторний запит через невалідну схему</dt><dd data-field="schema_retry_used">—</dd>
      </dl>
    </div>
  </div>
</div>

<script>
let conversationId = null;

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const errorEl = document.getElementById("error");

document.getElementById("send").addEventListener("click", send);
document.getElementById("reset").addEventListener("click", resetConversation);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") send();
});

function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setField(container, name, value) {
  const el = container.querySelector(`[data-field="${name}"]`);
  if (el) el.textContent = value;
}

function renderTicket(ticket) {
  const container = document.getElementById("ticket");
  setField(container, "topic", ticket.topic ?? "—");
  setField(container, "order_number", ticket.order_number ?? "—");
  setField(container, "grounded_in_rules", ticket.grounded_in_rules === null ? "—" : (ticket.grounded_in_rules ? "так" : "ні"));
  setField(container, "needs_clarification", ticket.needs_clarification === null ? "—" : (ticket.needs_clarification ? "так" : "ні"));
  const escalateEl = container.querySelector('[data-field="escalate_to_human"]');
  escalateEl.textContent = ticket.escalate_to_human ? "так" : "ні";
  escalateEl.className = ticket.escalate_to_human ? "flag-escalate" : "";
}

function renderService(data) {
  const container = document.getElementById("service");
  setField(container, "model", data.model);
  setField(container, "latency_ms", `${data.latency_ms} мс`);
  setField(container, "usage", `${data.usage.prompt_tokens} / ${data.usage.completion_tokens} / ${data.usage.total_tokens}`);
  setField(container, "estimated_tokens", data.estimated_tokens);
  setField(container, "schema_retry_used", data.schema_retry_used ? "так" : "ні");
}

function resetConversation() {
  conversationId = null;
  messagesEl.innerHTML = "";
  errorEl.textContent = "";
  renderTicket({ topic: null, order_number: null, grounded_in_rules: null, needs_clarification: null, escalate_to_human: false });
}

async function send() {
  const text = inputEl.value.trim();
  errorEl.textContent = "";
  if (!text) return;

  addMessage("user", text);
  inputEl.value = "";

  let response;
  try {
    response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: conversationId, message: text }),
    });
  } catch (e) {
    errorEl.textContent = "Мережева помилка: " + e.message;
    return;
  }

  const data = await response.json();

  if (!response.ok) {
    errorEl.textContent = data.detail || `Помилка ${response.status}`;
    return;
  }

  conversationId = data.conversation_id;
  addMessage("assistant", data.reply);
  renderTicket(data.ticket);
  renderService(data);
}
</script>
</body>
</html>
